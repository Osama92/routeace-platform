name: Deploy → Staging (develop)

on:
  push:
    branches: [develop]

jobs:
  migrate:
    name: Run DB migrations (dev)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Link dev Supabase project
        run: npx supabase link --project-ref sklsqzsjclblrjdgzkhz
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD_DEV }}

      - name: Push migrations to dev
        run: npx supabase db push --yes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD_DEV }}

# Frontend deploy is handled by Cloudflare's native Git integration
# (Workers Builds), which auto-deploys routeace-platform on every push.
# routeace-platform is a Cloudflare Worker, not a Pages project, so
# `wrangler pages deploy` can never find it — this job only needs to
# push DB migrations.
