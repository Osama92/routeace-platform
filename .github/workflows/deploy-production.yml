name: Deploy → Production

on:
  push:
    branches: [master]

jobs:
  migrate:
    name: Run DB migrations (production)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Link production Supabase project
        run: npx supabase link --project-ref mbybrzggrpyhvcnxhlua
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD_PROD }}

      - name: Push migrations to production
        run: npx supabase db push --yes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD_PROD }}

# Frontend deploy is handled by Cloudflare's native Git integration
# (Workers Builds), which auto-deploys routeace-platform on every push
# to master. routeace-platform is a Cloudflare Worker, not a Pages
# project, so `wrangler pages deploy` can never find it — this job
# only needs to push DB migrations.
