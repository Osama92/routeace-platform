name = "routeace-platform"
compatibility_date = "2025-01-01"
workers_dev = false
preview_urls = false

[assets]
directory = "./dist"
not_found_handling = "single-page-application"

# This is a Cloudflare Worker (Workers Static Assets), not a Pages project.
# Deploys happen via Cloudflare's native Git integration (Workers Builds),
# which auto-builds and deploys on every push to master/develop — not via
# GitHub Actions. Environment variables are set in the Cloudflare dashboard
# under this Worker's Settings → Variables and Secrets. Do NOT put secret
# keys here.
